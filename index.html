<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdf7ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151219" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Chaqqon-chaqqon — Mental arifmetika</title>
    <script>
      // Runs before the first paint, so the page never flashes the wrong theme.
      // Light is the default; only an explicit choice turns it dark or hands it to the OS.
      (function () {
        try {
          var choice = localStorage.getItem('chaqqon.theme');
          if (choice === 'dark' || choice === 'light') {
            document.documentElement.setAttribute('data-theme', choice);
          } else if (choice !== 'system') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
