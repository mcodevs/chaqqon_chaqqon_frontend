  <rect x="15.1" y="4.5" width="1.8" height="23" rx="0.9" fill="#fdf7ee" opacity="0.42"/>
  <polygon points="16.00,6.50 23.60,8.84 26.00,11.00 23.60,13.16 16.00,15.50 8.40,13.16 6.00,11.00 8.40,8.84" fill="#fdf7ee"/>
  <polygon points="16.00,17.00 23.60,19.34 26.00,21.50 23.60,23.66 16.00,26.00 8.40,23.66 6.00,21.50 8.40,19.34" fill="#f58a1f"/>
</svg>
